plugins { id 'com.android.application' }

android {
    namespace 'com.raushan.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.raushan.jarvis'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
