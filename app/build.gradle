plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.raushan.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.raushan.jarvis.next'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.12'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
}
