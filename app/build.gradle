plugins { id 'com.android.application' }

android {
    namespace 'com.raushan.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.raushan.jarvis'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
