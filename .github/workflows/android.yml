name: Build A.R.T.I.E. APK
on:
  push:
    branches: [ main, 'artie/**', 'rebrand/**' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK for A.R.T.I.E.
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ARTIE-v1.27.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ARTIE-v1.27-apk
          path: dist/ARTIE-v1.27.apk
          if-no-files-found: error
